  <!-- Arimo — запасний шрифт для тих, у кого немає Helvetica Neue (Windows, Android) -->
  <link href="https://fonts.googleapis.com/css2?family=Arimo:wght@400;700&display=swap&subset=cyrillic" rel="stylesheet" />
  <link rel="stylesheet" href="/styles.css" />
</head>
<body class="is-intro">
  <main class="screen" id="screen">

    <!-- Фінальний фон: два м'які вогники — вгорі зліва і внизу справа -->
    <div class="finale-light" aria-hidden="true"></div>
    <div class="finale-light finale-light--br" aria-hidden="true"></div>

    <!-- Заголовок: в інтро видно лише там, де світло від цятки -->
    <div class="layer title-layer" id="titleLayer">
      <div class="stage">
        <h1 class="title" id="title">
          <span class="word">Час</span><span class="gap"> </span><span class="word">прощатися</span>
        </h1>
      </div>
    </div>

    <!-- Решта інформації -->
    <div class="layer info-layer" id="infoLayer" aria-hidden="true">
      <div class="stage">
        <a class="logo rv" data-accent="y" href="https://postmen.ua/" target="_blank" rel="noopener" aria-label="POSTMEN — відкрити сайт" tabindex="-1">
          <img src="/assets/logo.svg" alt="POSTMEN" width="379" height="52" />
        </a>

        <p class="date"><span class="rv" data-accent="g">11/12</span><span class="rv" data-accent="g">2026</span></p>
        <p class="time rv" data-accent="y">18:30</p>
        <p class="place rv" data-accent="y">UNIT.Core</p>
        <p class="dress"><span class="up rv" data-accent="y">Дрескод:</span> <span class="rv" data-accent="y">святкувати життя</span></p>

        <div class="cal" id="cal">
          <button class="cal-btn" id="calBtn" type="button" aria-haspopup="true" aria-expanded="false" tabindex="-1">
            <span class="cal-btn-bg"></span>
            <span class="cal-btn-text">Додати<br />в календар</span>
          </button>
          <div class="cal-menu" id="calMenu" role="menu" hidden>
            <a role="menuitem" id="gcal" target="_blank" rel="noopener">Google Calendar</a>
            <a role="menuitem" href="/event.ics" download="chas-proshchatys.ics">Apple / Outlook (.ics)</a>
          </div>
        </div>
      </div>
    </div>

    <!-- Напівтонові шари для проявлення тексту -->
    <canvas class="dither" id="ditherCover" aria-hidden="true"></canvas>
    <canvas class="dither dither-accent" id="ditherAccent" aria-hidden="true"></canvas>

    <!-- Жовта цятка: проходить уздовж заголовка, потім стає кнопкою -->
    <div class="orb" id="orb" aria-hidden="true"></div>

    <!-- Клік / тап в інтро — пропустити далі -->
    <button class="intro-hit" id="introHit" type="button" aria-label="Відкрити запрошення"></button>
  </main>

  <div class="grain" aria-hidden="true"></div>

  <script src="/script.js"></script>
</body>
</html>
