<body class="is-intro">
  <main class="screen" id="screen">

    <!-- Шар із заголовком: в інтро видно лише крізь «ліхтарик» -->
    <div class="layer title-layer" id="titleLayer">
      <div class="stage">
        <h1 class="title" id="title">
          <span class="word">Час</span><span class="gap"> </span><span class="word">прощатись</span>
        </h1>
      </div>
    </div>

    <!-- Підказка в інтро -->
    <div class="layer hint-layer" id="hintLayer" aria-hidden="false">
      <div class="stage">
        <span class="dot"></span>
        <p class="hint">тисни на екран</p>
      </div>
    </div>

    <!-- Решта інформації: з'являється після кліку -->
    <div class="layer info-layer" id="infoLayer" aria-hidden="true">
      <div class="stage">
        <a class="logo reveal" href="https://postmen.ua/" target="_blank" rel="noopener" aria-label="POSTMEN — відкрити сайт" tabindex="-1">
          <img src="/assets/logo.svg" alt="POSTMEN" width="379" height="52" />
        </a>

        <p class="date reveal"><span>11/12</span><span>2026</span></p>
        <p class="time reveal">18:30</p>
        <p class="place reveal">UNIT.Core</p>
        <p class="dress reveal"><span class="up">Дрескод:</span> <span>святкувати життя</span></p>

        <div class="cal reveal" id="cal">
          <button class="cal-btn" id="calBtn" type="button" aria-haspopup="true" aria-expanded="false" tabindex="-1">
            <span class="cal-btn-bg"></span>
            <span class="cal-btn-text">Додати<br />в календар</span>
          </button>
          <div class="cal-menu" id="calMenu" role="menu" hidden>
            <a role="menuitem" id="gcal" target="_blank" rel="noopener">Google Calendar</a>
            <a role="menuitem" href="/event.ics" download="chas-proshchatys.ics">Apple / Outlook (.ics)</a>
          </div>
        </div>
      </div>
    </div>

    <button class="intro-hit" id="introHit" type="button" aria-label="Відкрити запрошення"></button>
  </main>

  <div class="grain" aria-hidden="true"></div>

  <script src="/script.js"></script>
